# EIOS layer. Passed as a fourth -f after the demo's own compose files, so no
# upstream file is ever edited and `git pull` on the demo stays conflict free.
#
# Usage, from the opentelemetry-demo directory:
#   docker compose -f compose.yaml -f compose.full.yaml \
#                  -f compose.observability.yaml -f ../eios/compose.eios.yaml up -d
#
# Build contexts are relative to the demo directory, since compose resolves
# paths against the first -f file.

x-eios-logging: &logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:

  eios-postgres:
    image: postgres:17-alpine
    container_name: eios-postgres
    environment:
      - POSTGRES_USER=eios
      - POSTGRES_PASSWORD=eios
      - POSTGRES_DB=eios
    volumes:
      - eios-pgdata:/var/lib/postgresql/data
      - ../eios/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eios -d eios"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 300M
    logging: *logging

  eios-ingest:
    build:
      context: ../eios
      dockerfile: ingest/Dockerfile
    container_name: eios-ingest
    environment:
      - KAFKA_ADDR=kafka:9092
      - KAFKA_TOPIC=orders
      - EIOS_EVENTS_TOPIC=eios.events
      - EIOS_CONSUMER_GROUP=eios-ingest
      - PROMETHEUS_URL=http://prometheus:9090
      - EIOS_PROM_POLL_SECONDS=30
      - EIOS_POSTGRES_DSN=postgresql://eios:eios@eios-postgres:5432/eios
      - EIOS_LOG_LEVEL=INFO
    depends_on:
      eios-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 250M
    logging: *logging

  eios-detect:
    build:
      context: ../eios
      dockerfile: detect/Dockerfile
    container_name: eios-detect
    environment:
      - KAFKA_ADDR=kafka:9092
      - EIOS_EVENTS_TOPIC=eios.events
      - EIOS_INCIDENTS_TOPIC=eios.incidents
      - EIOS_DETECT_GROUP=eios-detect
      - EIOS_POSTGRES_DSN=postgresql://eios:eios@eios-postgres:5432/eios
      - EIOS_EVAL_SECONDS=30
      - EIOS_COOLDOWN_SECONDS=180
      - EIOS_LOG_LEVEL=INFO
    depends_on:
      eios-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 250M
    logging: *logging

  eios-orchestrator:
    build:
      context: ../eios
      dockerfile: orchestrator/Dockerfile
    container_name: eios-orchestrator
    environment:
      - KAFKA_ADDR=kafka:9092
      - EIOS_INCIDENTS_TOPIC=eios.incidents
      - EIOS_ORCH_GROUP=eios-orchestrator
      - EIOS_POSTGRES_DSN=postgresql://eios:eios@eios-postgres:5432/eios
      - EIOS_LOG_LEVEL=INFO
      - FLAGD_CONFIG=/etc/flagd/demo.flagd.json
    volumes:
      # Read-write: the orchestrator flips flags to inject faults, so a fault
      # window and the flag that caused it are recorded in one action.
      - ../opentelemetry-demo/src/flagd:/etc/flagd
    ports:
      - "8000:8000"
    depends_on:
      eios-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M
    logging: *logging

  eios-dashboard:
    build:
      context: ../eios
      dockerfile: dashboard/Dockerfile
      args:
        # Baked in at build time, so the browser talks to the orchestrator
        # directly rather than through this container.
        VITE_API_BASE: http://127.0.0.1:8000
    container_name: eios-dashboard
    ports:
      - "5173:5173"
    depends_on:
      - eios-orchestrator
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 150M
    logging: *logging

volumes:
  eios-pgdata:
